name: Build, Push and Deploy to Dev

on:
  push:
    branches: [app]
  pull_request:
    branches: [app]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ecs-app-dev
  CDK_STACK: EcsCdkStack-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd app
          docker build \
            --build-arg REACT_APP_SHARETRIBE_SDK_CLIENT_ID=${{ secrets.REACT_APP_SHARETRIBE_SDK_CLIENT_ID }} \
            --build-arg REACT_APP_MARKETPLACE_NAME=${{ secrets.REACT_APP_MARKETPLACE_NAME }} \
            --build-arg REACT_APP_MARKETPLACE_ROOT_URL=${{ secrets.REACT_APP_MARKETPLACE_ROOT_URL }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build \
            --build-arg REACT_APP_SHARETRIBE_SDK_CLIENT_ID=${{ secrets.REACT_APP_SHARETRIBE_SDK_CLIENT_ID }} \
            --build-arg REACT_APP_MARKETPLACE_NAME=${{ secrets.REACT_APP_MARKETPLACE_NAME }} \
            --build-arg REACT_APP_MARKETPLACE_ROOT_URL=${{ secrets.REACT_APP_MARKETPLACE_ROOT_URL }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Force new deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/app'
        run: |
          CLUSTER=$(aws ecs list-clusters --region ${{ env.AWS_REGION }} \
            --query 'clusterArns[?contains(@, `EcsCdkStack-dev`)]' --output text)
          SERVICE=$(aws ecs list-services --cluster $CLUSTER --region ${{ env.AWS_REGION }} \
            --query 'serviceArns[0]' --output text)
          echo "Cluster: $CLUSTER"
          echo "Service: $SERVICE"
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment

      - name: Verify deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/app'
        run: |
          sleep 30
          SERVICE_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CDK_STACK }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ServiceURL`].OutputValue' \
            --output text)
          echo "Service URL: $SERVICE_URL"
          curl -sf $SERVICE_URL/_status.json || exit 1

  infra:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/app' &&
      (contains(github.event.head_commit.modified, 'lib/') ||
       contains(github.event.head_commit.modified, 'bin/') ||
       contains(github.event.head_commit.modified, 'cdk.json'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CDK dependencies
        run: npm ci

      - name: Deploy CDK Stack
        run: |
          npx cdk deploy \
            --context env=dev \
            --require-approval never \
            --require-approval broadening
