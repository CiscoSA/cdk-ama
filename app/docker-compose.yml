version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
      # - '3500:3500'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - REACT_APP_ENV=development
      - PORT=3000
      # - REACT_APP_DEV_API_SERVER_PORT=3500
    command: yarn dev
    stdin_open: true
